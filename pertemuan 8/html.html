<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Sederhana dengan LocalStorage</title>
    <script src="script.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        background: #ffffff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      .card h2 {
        margin-bottom: 8px;
        color: #0f172a;
        font-size: 24px;
      }

      .card p.subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
      }

      .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        border-color: #2563eb;
      }

      .btn {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn:hover {
        background-color: #1d4ed8;
      }

      .btn-danger {
        background-color: #ef4444;
        margin-top: 16px;
      }

      .btn-danger:hover {
        background-color: #dc2626;
      }

      .hidden {
        display: none !important;
      }

      .user-info {
        text-align: center;
        padding: 10px 0;
      }

      .user-info h3 {
        color: #2563eb;
        margin-bottom: 8px;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <!-- Form Login -->
    <div id="loginCard" class="card">
      <h2>Masuk Akun</h2>
      <p class="subtitle">Masukkan username dan password Anda</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          />
        </div>

        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- Tampilan Setelah Login -->
    <div id="dashboardCard" class="card hidden">
      <div class="user-info">
        <h2>Selamat Datang!</h2>
        <h3 id="welcomeMessage"></h3>
        <p class="subtitle">Sesi Anda tersimpan di LocalStorage.</p>
        <button id="btnLogout" class="btn btn-danger">Logout</button>
      </div>
    </div>
  </body>
</html>
